camera:
  device_serial: ''
  color:
    width: 1920
    height: 1080
    fps: 8
    fx: 1363.68
    fy: 1361.19
    cx: 971.19
    cy: 566.26
  depth:
    width: 848
    height: 480
    fps: 30
  align_to_color: true
  visual_preset: 3
  laser_power: 120
  filters:
    decimation:
      enabled: false
      magnitude: 2
    spatial:
      enabled: true
      smooth_alpha: 0.5
      smooth_delta: 20
      magnitude: 2
      hole_fill: 1
    temporal:
      enabled: true
      smooth_alpha: 0.4
      smooth_delta: 20
      persistence_control: 3
    threshold:
      enabled: true
      min_distance: 0.4
      max_distance: 0.7
  colormap:
    min_distance: 0.48
    max_distance: 0.66
    auto_range: false
vision:
  table_margin_mm: 8.0
  min_asparagus_area: 600
  min_length_mm: 60.0
  max_length_mm: 550.0
  min_diam_mm: 5.0
  max_diam_mm: 65.0
  min_aspect_ratio: 1.8
calibration:
  # Tag 全部状态已下沉至 data/workspaces/<id>/tag_whitelist.yaml (tag_anchors / allowed_ids)
  # 与 tags_map.yaml (BA 输出), 全局 config.yaml 不再持有任何 Tag ID / 世界坐标
  tag_detection:
    contrast_boost: 1.6
    enable_auto_stretch: true
    clahe_clip_limit: 4.0
    min_otsu_std_dev: 1.5
    adaptive_thresh_constant: 3.0
    min_perimeter_rate: 0.006
